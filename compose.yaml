name: orpira-domino

services:
  domino-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: orpira/domino-api:${DOMINO_IMAGE_TAG:-0.5.0}
    container_name: orpira-domino-api
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DOMINO_DATA_DIR: /app/data
      DOMINO_ALLOWED_ORIGINS: ${DOMINO_ALLOWED_ORIGINS:?Define los orígenes HTTPS exactos en .env}
      # Solo Nginx Proxy Manager alcanza el contenedor (sin puertos publicados), por eso se confía en X-Forwarded-For.
      DOMINO_TRUST_PROXY: ${DOMINO_TRUST_PROXY:-true}
      DOMINO_RATE_LIMIT_MAX: ${DOMINO_RATE_LIMIT_MAX:-600}
      DOMINO_RATE_LIMIT_WINDOW_SECONDS: ${DOMINO_RATE_LIMIT_WINDOW_SECONDS:-60}
      DOMINO_IDENTITY_LIMIT_MAX: ${DOMINO_IDENTITY_LIMIT_MAX:-20}
      DOMINO_IDENTITY_LIMIT_WINDOW_SECONDS: ${DOMINO_IDENTITY_LIMIT_WINDOW_SECONDS:-86400}
    expose:
      - "8787"
    volumes:
      - domino_data:/app/data
    networks:
      - orpira-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  domino_data:
    name: orpira_domino_data

networks:
  orpira-network:
    external: true
    name: orpira-network
