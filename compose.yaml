name: orpira-domino

services:
  domino-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: orpira/domino-api:${DOMINO_IMAGE_TAG:-0.5.0}
    container_name: orpira-domino-api
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DOMINO_DATA_DIR: /app/data
      DOMINO_ALLOWED_ORIGINS: ${DOMINO_ALLOWED_ORIGINS:?Define los orígenes HTTPS exactos en .env}
    expose:
      - "8787"
    volumes:
      - domino_data:/app/data
    networks:
      - orpira-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  domino_data:
    name: orpira_domino_data

networks:
  orpira-network:
    external: true
    name: orpira-network
